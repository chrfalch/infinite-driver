<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Drift — soft tyre lab</title>
    <style>
      html, body { margin: 0; height: 100%; background: #e9e2d3; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; }
      .lil-gui.tuning,
      .lil-gui.tuning .lil-gui {
        --background-color: rgba(250, 246, 238, 0.92);
        --widget-color: #e4dccb;
        --hover-color: #d8cfbb;
        --focus-color: #cfc5ae;
        --number-color: #9a5b2c;
        --string-color: #6b7f3a;
        --text-color: #4a4538;
        --title-background-color: #e9e0cd;
        --title-text-color: #4a4538;
        --font-size: 11px;
        --width: 290px;
      }
      .lil-gui.tuning {
        top: 12px;
        right: 12px;
        max-height: calc(100vh - 24px);
        overflow-y: auto;
        border-radius: 6px;
        box-shadow: 0 2px 12px rgba(60, 50, 30, 0.15);
      }
      .fatal { position: fixed; inset: 16px; margin: 0; padding: 16px; background: #fff; color: #a00; font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; overflow: auto; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/tirelab/main.js"></script>
  </body>
</html>
