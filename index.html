<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="data:," />
    <title>Drift — an endless drive</title>
    <style>
      html, body { margin: 0; height: 100%; background: #e9e2d3; overflow: hidden; overscroll-behavior: none; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; }
      .lil-gui.tuning,
      .lil-gui.tuning .lil-gui {
        --background-color: rgba(250, 246, 238, 0.92);
        --widget-color: #e4dccb;
        --hover-color: #d8cfbb;
        --focus-color: #cfc5ae;
        --number-color: #9a5b2c;
        --string-color: #6b7f3a;
        --text-color: #4a4538;
        --title-background-color: #e9e0cd;
        --title-text-color: #4a4538;
        --font-size: 11px;
        --width: 290px;
      }
      .lil-gui.tuning {
        top: 12px;
        right: 12px;
        max-height: calc(100vh - 24px);
        overflow-y: auto;
        border-radius: 6px;
        box-shadow: 0 2px 12px rgba(60, 50, 30, 0.15);
      }
      .touch-controls { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 5; }
      .touch-controls.visible { display: block; }
      .touch-btn {
        position: absolute; pointer-events: auto; touch-action: none;
        width: 84px; height: 84px; border-radius: 50%;
        border: 1px solid rgba(74, 69, 56, 0.25); background: rgba(250, 246, 238, 0.55);
        color: #4a4538; font: 600 26px/1 system-ui, sans-serif;
        box-shadow: 0 2px 10px rgba(60, 50, 30, 0.15);
        -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
        -webkit-tap-highlight-color: transparent;
      }
      .touch-btn.down { background: rgba(217, 104, 63, 0.7); color: #fff; }
      .touch-btn.small { width: auto; height: 40px; padding: 0 16px; border-radius: 20px; font-size: 14px; }
      .area-left { left: calc(20px + env(safe-area-inset-left)); bottom: calc(28px + env(safe-area-inset-bottom)); }
      .area-right { left: calc(120px + env(safe-area-inset-left)); bottom: calc(28px + env(safe-area-inset-bottom)); }
      .area-gas { right: calc(20px + env(safe-area-inset-right)); bottom: calc(124px + env(safe-area-inset-bottom)); }
      .area-brake { right: calc(20px + env(safe-area-inset-right)); bottom: calc(28px + env(safe-area-inset-bottom)); }
      .area-hand { right: calc(120px + env(safe-area-inset-right)); bottom: calc(50px + env(safe-area-inset-bottom)); }
      .area-respawn { left: calc(20px + env(safe-area-inset-left)); bottom: calc(128px + env(safe-area-inset-bottom)); }
      .area-camera { left: calc(130px + env(safe-area-inset-left)); bottom: calc(128px + env(safe-area-inset-bottom)); }
      @media (max-width: 700px) {
        .lil-gui.tuning { --width: 250px; max-height: 60vh; }
      }
      .fatal { position: fixed; inset: 16px; margin: 0; padding: 16px; background: #fff; color: #a00; font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; overflow: auto; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
